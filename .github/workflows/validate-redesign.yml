name: Validate NDRAAAID redesign

on:
  push:
    branches:
      - "feat/ndraaaid-charcoal-silver-redesign"
  pull_request:
    branches:
      - main
      - feat/unified-trx-center

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
        run: npm run build
