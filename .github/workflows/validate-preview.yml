name: Validate preview branch
on:
  push:
    branches:
      - "fix/ndraaaid-icons-access-audit-2026-10-16"
  pull_request:
    branches:
      - "feat/ndraaaid-integrated-redesign"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
